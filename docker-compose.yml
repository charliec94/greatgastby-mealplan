services:
  savorly:
    image: ghcr.io/charliec94/greatgastby-mealplan:latest
    build: .
    container_name: savorly
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      USDA_API_KEY: ${USDA_API_KEY:-}
      RECIPE_API_KEY: ${RECIPE_API_KEY:-}
      MEALDB_API_KEY: ${MEALDB_API_KEY:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    restart: unless-stopped
